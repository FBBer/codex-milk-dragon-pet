name: Validate pet package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pet-quality:
    name: Pet quality on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install 'Pillow>=12,<14'
      - name: Validate encoded artwork and quality regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_quality.py --output-dir "$RUNNER_TEMP/pet-quality"
          python tests/test_quality.py
          python tests/test_quality_evidence.py

  unix-install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify package and installer
        shell: bash
        run: |
          set -euo pipefail

          sh tests/test_install.sh
          sh tests/test_build_release.sh

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi

          jq -e '
            .id == "milk-dragon" and
            .displayName == "奶龙" and
            .description == "一个老绷带" and
            .spriteVersionNumber == 2 and
            .spritesheetPath == "spritesheet.webp"
          ' pet.json >/dev/null

          repository_root="$PWD"
          installer="$repository_root/scripts/install.sh"
          export CODEX_HOME="$RUNNER_TEMP/奶龙 codex home"
          cd "$RUNNER_TEMP"
          sh "$installer"
          cmp "$repository_root/pet.json" "$CODEX_HOME/pets/milk-dragon/pet.json"
          cmp "$repository_root/spritesheet.webp" "$CODEX_HOME/pets/milk-dragon/spritesheet.webp"

          if sh "$installer"; then
            echo "Expected a protected reinstall to fail." >&2
            exit 1
          fi

          sh "$installer" --force

          canary="$RUNNER_TEMP/canary.txt"
          printf '%s\n' "do-not-overwrite" >"$canary"
          rm "$CODEX_HOME/pets/milk-dragon/pet.json"
          ln -s "$canary" "$CODEX_HOME/pets/milk-dragon/pet.json"
          if sh "$installer" --force; then
            echo "Expected a linked target file to be rejected." >&2
            exit 1
          fi
          test "$(cat "$canary")" = "do-not-overwrite"

          first_build="$RUNNER_TEMP/release build one"
          second_build="$RUNNER_TEMP/release build two"
          sh "$repository_root/scripts/build-release.sh" v1.0.1 "$first_build"
          sh "$repository_root/scripts/build-release.sh" v1.0.1 "$second_build"
          cmp \
            "$first_build/milk-dragon-codex-pet-v1.0.1.zip" \
            "$second_build/milk-dragon-codex-pet-v1.0.1.zip"
          cmp \
            "$first_build/milk-dragon-codex-pet-v1.0.1.zip.sha256" \
            "$second_build/milk-dragon-codex-pet-v1.0.1.zip.sha256"

  windows-install:
    name: Install on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run isolated Windows installer regressions
        shell: powershell
        run: '& .\tests\test_install.ps1'

      - name: Verify package and installer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $Manifest = Get-Content -LiteralPath "pet.json" -Raw | ConvertFrom-Json
          if ($Manifest.id -ne "milk-dragon" -or
              $Manifest.displayName -ne "奶龙" -or
              $Manifest.description -ne "一个老绷带" -or
              $Manifest.spriteVersionNumber -ne 2 -or
              $Manifest.spritesheetPath -ne "spritesheet.webp") {
              throw "pet.json does not match the expected manifest."
          }

          $ExpectedSpriteHash = "d909d5f9de11e015e44564c76be3713edd078a8acfea88c54e4228d71ae2fbc9"
          $ActualSpriteHash = (Get-FileHash -LiteralPath "spritesheet.webp" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSpriteHash -ne $ExpectedSpriteHash) {
              throw "spritesheet.webp checksum mismatch."
          }

          $RepositoryRoot = (Get-Location).Path
          $Installer = Join-Path $RepositoryRoot "scripts\install.ps1"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "奶龙 codex home"
          Set-Location -LiteralPath $env:RUNNER_TEMP
          & $Installer

          $Destination = Join-Path $env:CODEX_HOME "pets\milk-dragon"
          if ((Get-FileHash -LiteralPath (Join-Path $RepositoryRoot "pet.json") -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath (Join-Path $Destination "pet.json") -Algorithm SHA256).Hash) {
              throw "Installed pet.json differs from the package."
          }
          if ((Get-FileHash -LiteralPath (Join-Path $RepositoryRoot "spritesheet.webp") -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath (Join-Path $Destination "spritesheet.webp") -Algorithm SHA256).Hash) {
              throw "Installed spritesheet.webp differs from the package."
          }

          $ProtectedReinstallFailed = $false
          try {
              & $Installer
          }
          catch {
              $ProtectedReinstallFailed = $true
          }
          if (-not $ProtectedReinstallFailed) {
              throw "Expected a protected reinstall to fail."
          }

          & $Installer -Force

          $Canary = Join-Path $env:RUNNER_TEMP "canary.txt"
          Set-Content -LiteralPath $Canary -Value "do-not-overwrite" -NoNewline
          $InstalledManifest = Join-Path $Destination "pet.json"
          Remove-Item -LiteralPath $InstalledManifest -Force
          New-Item -ItemType HardLink -Path $InstalledManifest -Target $Canary | Out-Null
          & $Installer -Force
          if ((Get-Content -LiteralPath $Canary -Raw) -ne "do-not-overwrite") {
              throw "Installer overwrote a hard-linked file outside the pet directory."
          }
          if ((Get-FileHash -LiteralPath (Join-Path $RepositoryRoot "pet.json") -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $InstalledManifest -Algorithm SHA256).Hash) {
              throw "Hard-link-safe update did not install the packaged pet.json."
          }

          $Leftovers = @(Get-ChildItem -LiteralPath $Destination -Force |
              Where-Object { $_.Name -like ".*.install.*" })
          if ($Leftovers.Count -ne 0) {
              throw "Installer left temporary or backup files behind."
          }
